name: Refresh Your Daily Queue feeds

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_feed.py"
      - "requirements.txt"
      - "build.mjs"
      - "app.js"
      - "index.html"
      - "polish.css"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: your-daily-queue-feed
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install feed dependencies
        run: pip install -r requirements.txt

      - name: Generate live RSS feed
        run: python scripts/generate_feed.py

      - name: Validate production build
        run: npm run build

      - name: Commit refreshed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/feed.js
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Refresh Your Daily Queue feeds"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
